
name: Deploy OSINT Staging

on:
  push:
    branches:
      - main
    paths:
      - "worker/src/index.js"
      - "worker/src/**"
      - "config/settings.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-staging.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate settings JSON
        run: |
          python -m json.tool config/settings.json > /dev/null
          echo "Settings JSON is valid"

      - name: Validate JavaScript syntax
        run: |
          node --input-type=module --check < worker/src/index.js
          node --input-type=module --check < worker/src/hourly-social.js
          echo "JavaScript syntax is valid"

      - name: Deploy to Cloudflare Staging
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
